# /etc/monit/conf-enabled/voice-faq
# Monitor the localhost-only HTTP endpoint and restart the systemd-managed Compose stack.
check host voice-faq with address 127.0.0.1
    start program = "/bin/systemctl start voice-faq.service"
    stop program = "/bin/systemctl stop voice-faq.service"
    if failed port 5000 protocol http request "/health" for 2 cycles then restart
    if 3 restarts within 5 cycles then alert
