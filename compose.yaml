services:
  voice-faq:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/conversations.db
    volumes:
      - faq_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=8)"]
      interval: 45s
      timeout: 10s
      start_period: 180s
      retries: 3
volumes:
  faq_data:
